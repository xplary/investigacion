<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Investigación - UNP</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- FIREBASE -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

    <style>
        body { background-color: #f8f9fa; color: #212529; font-family: system-ui, sans-serif; padding-bottom: 50px; }
        .text-brand { color: #712cf9; }
        .bg-brand { background-color: #712cf9; color: white; }
        .border-brand { border-color: #712cf9 !important; }
        .btn-brand { background-color: #712cf9; color: white; border: none; }
        .btn-brand:hover { background-color: #5a23c8; color: white; }
        .card-custom { border: 1px solid rgba(0,0,0,.08); border-radius: 0.75rem; box-shadow: 0 0.125rem 0.25rem rgba(0,0,0,.04); background: #fff; }
        [contenteditable="true"] { padding: 5px; border-radius: 4px; transition: 0.2s; border: 1px dashed transparent; }
        [contenteditable="true"]:hover { background-color: #e9ecef; border-color: #adb5bd; outline: none; }
        [contenteditable="true"]:focus { background-color: #fff; border-color: #712cf9; box-shadow: 0 0 0 0.2rem rgba(113,44,249,.25); outline: none; }
        
        .note-card { border-left: 4px solid #712cf9 !important; position: relative; }
        .form-control-custom { border: 1px solid #dee2e6; border-radius: 0.5rem; resize: none; }
        .form-control-custom:focus { border-color: #712cf9; box-shadow: 0 0 0 0.25rem rgba(113, 44, 249, 0.25); }
        .note-img { max-width: 100%; border-radius: 0.5rem; margin-top: 10px; border: 1px solid #e9ecef; }
        #preview-container { display: none; position: relative; margin-bottom: 10px; }
        #preview-img { max-height: 100px; border-radius: 5px; }
        .btn-remove-img { position: absolute; top: -10px; left: -10px; border-radius: 50%; padding: 2px 8px; }
        
        .action-buttons { position: absolute; top: 12px; right: 15px; display: flex; gap: 8px; opacity: 0.7; transition: 0.2s;}
        .note-card:hover .action-buttons { opacity: 1; }
        .btn-icon { background: none; border: none; cursor: pointer; font-size: 0.9rem; padding: 0;}
        .btn-icon:hover { transform: scale(1.1); }
        
        #chat-messages { height: 250px; overflow-y: auto; background-color: #f1f3f5; padding: 15px; display: flex; flex-direction: column; gap: 10px; }
        .chat-bubble { max-width: 85%; padding: 8px 12px; border-radius: 12px; font-size: 0.85rem; line-height: 1.3;}
        .chat-me { background-color: #712cf9; color: white; border-bottom-right-radius: 2px; align-self: flex-end; }
        .chat-other { background-color: #fff; border: 1px solid #dee2e6; color: #212529; border-bottom-left-radius: 2px; align-self: flex-start; }
        .chat-author { font-size: 0.65rem; font-weight: bold; margin-bottom: 3px; opacity: 0.8; }

        /* Estilos para listas y enlaces dentro de las publicaciones */
        .note-card ul, .note-card ol { padding-left: 1.5rem; margin-top: 0.5rem; margin-bottom: 0.5rem; }
        .note-card a { color: #712cf9; text-decoration: underline; font-weight: 500; }
        .note-card a:hover { color: #5a23c8; }
    </style>
</head>
<body>

<div class="container py-4">
    <header class="pb-3 mb-4 border-bottom d-flex flex-column flex-md-row justify-content-between align-items-md-center gap-3">
        <div>
            <div class="text-muted small mb-2 fw-semibold">
                <i class="fas fa-university me-1 text-brand"></i> UNIVERSIDAD NACIONAL DE PIURA
            </div>
            <h1 id="titulo-doc" class="fw-bold fs-2 mb-1" contenteditable="true" title="Clic para editar título">Dinámica de la morosidad</h1>
            <h2 id="subtitulo-doc" class="text-muted fs-5 fw-normal mb-0" contenteditable="true" title="Clic para editar subtítulo">Y sus determinantes macrofinancieros en la banca múltiple del Perú (2018-2026)</h2>
        </div>
        
        <!-- IDENTIDAD GLOBAL -->
        <div class="p-2 rounded bg-white shadow-sm border border-brand" style="min-width: 220px;">
            <label for="nombre-usuario" class="form-label small fw-bold text-brand mb-1"><i class="fas fa-user-astronaut me-1"></i> Identidad Activa</label>
            <input type="text" id="nombre-usuario" class="form-control form-control-sm fw-bold" title="Este nombre aparecerá en tus notas y en el chat" onchange="guardarNombre()" onkeyup="guardarNombre()">
        </div>
    </header>

    <div class="row g-4">
        <!-- COLUMNA IZQUIERDA: FEED DE NOTAS -->
        <div class="col-lg-7">
            <h4 class="fw-bold mb-3"><i class="fas fa-satellite-dish me-2 text-brand"></i> Transmisiones del Equipo</h4>
            <div id="feed-notas">
                <div class="text-center text-muted mt-5" id="cargando-notas">
                    <i class="fas fa-spinner fa-spin fa-2x mb-2"></i><br>Conectando a la base de datos...
                </div>
            </div>
        </div>

        <!-- COLUMNA DERECHA: PANELES DE CONTROL -->
        <div class="col-lg-5">
            
            <!-- PANEL 1: PUBLICAR/EDITAR NOTA -->
            <div class="card card-custom mb-4 border-0 shadow-sm" style="border-top: 4px solid #712cf9 !important;">
                <div class="card-header bg-white border-bottom fw-bold text-dark py-3" id="titulo-panel-edicion">
                    <i class="fas fa-pen me-1 text-brand"></i> Nueva Publicación
                </div>
                <div class="card-body">
                    <!-- BARRA DE HERRAMIENTAS DE FORMATO -->
                    <div class="btn-group btn-group-sm mb-2 w-100 shadow-sm" role="group">
                        <button type="button" class="btn btn-outline-secondary" onclick="insertarFormato('bold')" title="Negrita"><i class="fas fa-bold"></i></button>
                        <button type="button" class="btn btn-outline-secondary" onclick="insertarFormato('italic')" title="Cursiva"><i class="fas fa-italic"></i></button>
                        <button type="button" class="btn btn-outline-secondary" onclick="insertarFormato('color')" title="Color de texto"><i class="fas fa-palette"></i></button>
                        <button type="button" class="btn btn-outline-secondary" onclick="insertarFormato('list')" title="Lista con viñetas"><i class="fas fa-list-ul"></i></button>
                        <button type="button" class="btn btn-outline-secondary" onclick="insertarFormato('link')" title="Enlace / Link"><i class="fas fa-link"></i></button>
                    </div>

                    <textarea id="texto-nota" class="form-control form-control-custom mb-2" rows="3" placeholder="Redacta un hallazgo o apunte..."></textarea>
                    
                    <div id="preview-container">
                        <img id="preview-img" src="" alt="Vista previa">
                        <button class="btn btn-danger btn-sm btn-remove-img" onclick="quitarImagen()"><i class="fas fa-times"></i></button>
                    </div>

                    <div class="d-flex justify-content-between align-items-center mt-3">
                        <input type="file" id="input-foto" accept="image/*" style="display: none;" onchange="cargarImagen(event)">
                        <button class="btn btn-sm btn-light border shadow-sm" type="button" onclick="document.getElementById('input-foto').click()">
                            <i class="fas fa-camera me-1 text-muted"></i> Foto
                        </button>
                        
                        <div>
                            <button id="btn-cancelar-edicion" class="btn btn-sm btn-secondary d-none me-1" type="button" onclick="cancelarEdicion()">Cancelar</button>
                            <button id="btn-publicar" class="btn btn-brand px-4 shadow-sm fw-bold" type="button" onclick="publicarNota()">
                                Publicar <i class="fas fa-paper-plane ms-1"></i>
                            </button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- PANEL 2: CHAT DE EQUIPO -->
            <div class="card card-custom mb-4 border-0 shadow-sm">
                <div class="card-header bg-white border-bottom fw-bold text-dark py-2 d-flex justify-content-between align-items-center">
                    <span><i class="fas fa-comments me-1 text-brand"></i> Chat del Equipo</span>
                    <span class="badge bg-success" style="font-size: 0.6rem;">EN LÍNEA</span>
                </div>
                <div id="chat-messages">
                    <!-- Los mensajes del chat van aquí -->
                </div>
                <div class="card-footer bg-white border-top p-2">
                    <div class="input-group input-group-sm">
                        <input type="text" id="chat-input" class="form-control" placeholder="Escribe un mensaje..." onkeypress="manejarEnterChat(event)">
                        <button class="btn btn-brand" type="button" onclick="enviarMensaje()"><i class="fas fa-paper-plane"></i></button>
                    </div>
                </div>
            </div>

            <!-- PANEL 3: BIBLIOGRAFÍA -->
            <div class="card card-custom mb-4 border-0 shadow-sm">
                <div class="card-header bg-white border-bottom d-flex justify-content-between align-items-center py-3">
                    <span class="fw-bold text-dark"><i class="fas fa-bookmark me-1 text-brand"></i> Bibliografía Compartida</span>
                    <button class="btn btn-sm btn-light border text-brand rounded-circle" type="button" onclick="agregarBibliografia()">
                        <i class="fas fa-plus"></i>
                    </button>
                </div>
                <div class="card-body p-0 px-3">
                    <ul class="list-group list-group-flush" id="lista-biblio">
                        <!-- Las bibliografías cargarán aquí automáticamente -->
                    </ul>
                </div>
            </div>

        </div>
    </div>
</div>

<script>
    // ==========================================
    // CONFIGURACIÓN DE FIREBASE
    // ==========================================
    const firebaseConfig = {
        apiKey: "AIzaSyBlz5QoMwyp5oEJOXbocwFYuypxiIa-udI",
        authDomain: "tesis-b4554.firebaseapp.com",
        projectId: "tesis-b4554",
        storageBucket: "tesis-b4554.firebasestorage.app",
        messagingSenderId: "145791282196",
        appId: "1:145791282196:web:a73cecae9c93100371cb01",
        measurementId: "G-VK5VEPFD9R"
    };

    let db;
    try {
        firebase.initializeApp(firebaseConfig);
        db = firebase.firestore();
    } catch (e) {
        document.getElementById('cargando-notas').innerHTML = "⚠️ Error al conectar con Firebase.";
    }

    // --- MANEJO DE IDENTIDAD GLOBAL (NOMBRES) ---
    function generarNombreAleatorio() {
        return "Investigador_" + Math.floor(Math.random() * 10000);
    }

    function inicializarNombre() {
        let nombreGuardado = localStorage.getItem('identidadUNP');
        if (!nombreGuardado || nombreGuardado.trim() === "") {
            nombreGuardado = generarNombreAleatorio();
            localStorage.setItem('identidadUNP', nombreGuardado);
        }
        document.getElementById('nombre-usuario').value = nombreGuardado;
    }

    function guardarNombre() {
        let nuevoNombre = document.getElementById('nombre-usuario').value.trim();
        if (nuevoNombre === "") {
            nuevoNombre = generarNombreAleatorio();
            document.getElementById('nombre-usuario').value = nuevoNombre;
        }
        localStorage.setItem('identidadUNP', nuevoNombre);
    }

    window.addEventListener('DOMContentLoaded', inicializarNombre);

    // --- VARIABLES GLOBALES DE ESTADO ---
    let imagenActualBase64 = null;
    let notasData = {}; 
    let biblioData = {}; 
    let idEdicionActual = null; 

    // --- HERRAMIENTA DE FORMATO DE TEXTO ---
    function insertarFormato(tipo) {
        const textarea = document.getElementById('texto-nota');
        const start = textarea.selectionStart;
        const end = textarea.selectionEnd;
        const textoSeleccionado = textarea.value.substring(start, end);
        let reemplazo = '';

        if (tipo === 'bold') {
            reemplazo = `<b>${textoSeleccionado || 'texto en negrita'}</b>`;
        } else if (tipo === 'italic') {
            reemplazo = `<i>${textoSeleccionado || 'texto en cursiva'}</i>`;
        } else if (tipo === 'color') {
            const color = prompt("Ingresa el color (ej. #712cf9, red, blue, green):", "#712cf9");
            if (!color) return;
            reemplazo = `<span style="color: ${color};">${textoSeleccionado || 'texto con color'}</span>`;
        } else if (tipo === 'list') {
            reemplazo = `<ul><li>${textoSeleccionado || 'Elemento de lista'}</li></ul>`;
        } else if (tipo === 'link') {
            let url = prompt("Ingresa el enlace web (URL):", "https://");
            if (!url) return;
            if (!url.startsWith('http')) url = 'https://' + url;
            reemplazo = `<a href="${url}" target="_blank">${textoSeleccionado || url}</a>`;
        }

        textarea.value = textarea.value.substring(0, start) + reemplazo + textarea.value.substring(end);
        textarea.focus();
        textarea.setSelectionRange(start + reemplazo.length, start + reemplazo.length);
    }

    // --- SINCRONIZACIÓN DE TÍTULOS ---
    const elementTitulo = document.getElementById('titulo-doc');
    const elementSubtitulo = document.getElementById('subtitulo-doc');

    function guardarTitulos() {
        if (!db) return;
        db.collection("config").doc("textos-cabecera").set({
            titulo: elementTitulo.innerText.trim(),
            subtitulo: elementSubtitulo.innerText.trim()
        }, { merge: true }).catch(err => console.error("Error guardando títulos", err));
    }

    elementTitulo.addEventListener('blur', guardarTitulos);
    elementSubtitulo.addEventListener('blur', guardarTitulos);

    function prevenirEnter(e) {
        if (e.key === 'Enter') {
            e.preventDefault();
            e.target.blur(); 
        }
    }
    elementTitulo.addEventListener('keydown', prevenirEnter);
    elementSubtitulo.addEventListener('keydown', prevenirEnter);

    if (db) {
        db.collection("config").doc("textos-cabecera").onSnapshot((doc) => {
            if (doc.exists) {
                const data = doc.data();
                if (document.activeElement !== elementTitulo && data.titulo) {
                    elementTitulo.innerText = data.titulo;
                }
                if (document.activeElement !== elementSubtitulo && data.subtitulo) {
                    elementSubtitulo.innerText = data.subtitulo;
                }
            }
        });
    }

    // --- MANEJO DE IMÁGENES CON COMPRESOR AUTOMÁTICO ---
    function cargarImagen(event) {
        const archivo = event.target.files[0];
        if (!archivo) return;
        
        const lector = new FileReader();
        lector.onload = function(e) {
            const img = new Image();
            img.onload = function() {
                const canvas = document.createElement('canvas');
                const MAX_WIDTH = 800;
                const MAX_HEIGHT = 800;
                let width = img.width;
                let height = img.height;

                if (width > height) {
                    if (width > MAX_WIDTH) { height *= MAX_WIDTH / width; width = MAX_WIDTH; }
                } else {
                    if (height > MAX_HEIGHT) { width *= MAX_HEIGHT / height; height = MAX_HEIGHT; }
                }

                canvas.width = width;
                canvas.height = height;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(img, 0, 0, width, height);

                imagenActualBase64 = canvas.toDataURL('image/jpeg', 0.7);
                
                document.getElementById('preview-img').src = imagenActualBase64;
                document.getElementById('preview-container').style.display = 'inline-block';
            };
            img.src = e.target.result;
        };
        lector.readAsDataURL(archivo);
    }

    function quitarImagen() {
        imagenActualBase64 = null;
        document.getElementById('preview-img').src = "";
        document.getElementById('preview-container').style.display = 'none';
        document.getElementById('input-foto').value = "";
    }

    // --- CREAR Y EDITAR NOTAS ---
    function publicarNota() {
        if (!db) return alert("Error de conexión.");
        const texto = document.getElementById('texto-nota').value.trim();
        const autor = document.getElementById('nombre-usuario').value.trim();
        
        if (texto === "" && !imagenActualBase64) return alert("Escribe un texto o sube una foto.");

        const btnPublicar = document.getElementById('btn-publicar');
        btnPublicar.disabled = true;

        if (idEdicionActual) {
            db.collection("notas").doc(idEdicionActual).update({
                texto: texto.replace(/\n/g, '<br>'),
                imagen: imagenActualBase64,
                editado: true
            }).then(() => {
                cancelarEdicion();
                btnPublicar.disabled = false;
            }).catch(err => {
                alert("Error al editar.");
                btnPublicar.disabled = false;
            });
        } else {
            db.collection("notas").add({
                autor: autor,
                texto: texto.replace(/\n/g, '<br>'),
                imagen: imagenActualBase64,
                fecha_texto: new Date().toLocaleDateString('es-ES', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' }),
                timestamp: firebase.firestore.FieldValue.serverTimestamp()
            }).then(() => {
                document.getElementById('texto-nota').value = "";
                quitarImagen();
                btnPublicar.disabled = false;
            }).catch(err => {
                alert("Error al publicar la nota.");
                console.error(err);
                btnPublicar.disabled = false;
            });
        }
    }

    function iniciarEdicionNota(id) {
        idEdicionActual = id;
        const nota = notasData[id];
        
        document.getElementById('texto-nota').value = nota.texto.replace(/<br>/g, '\n');
        
        if (nota.imagen) {
            imagenActualBase64 = nota.imagen;
            document.getElementById('preview-img').src = imagenActualBase64;
            document.getElementById('preview-container').style.display = 'inline-block';
        } else {
            quitarImagen();
        }

        document.getElementById('titulo-panel-edicion').innerHTML = '<i class="fas fa-edit me-1 text-warning"></i> Editando Publicación';
        document.getElementById('btn-publicar').innerHTML = 'Guardar <i class="fas fa-save ms-1"></i>';
        document.getElementById('btn-publicar').classList.replace('btn-brand', 'btn-warning');
        document.getElementById('btn-cancelar-edicion').classList.remove('d-none');
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function cancelarEdicion() {
        idEdicionActual = null;
        document.getElementById('texto-nota').value = "";
        quitarImagen();
        document.getElementById('titulo-panel-edicion').innerHTML = '<i class="fas fa-pen me-1 text-brand"></i> Nueva Publicación';
        document.getElementById('btn-publicar').innerHTML = 'Publicar <i class="fas fa-paper-plane ms-1"></i>';
        document.getElementById('btn-publicar').classList.replace('btn-warning', 'btn-brand');
        document.getElementById('btn-cancelar-edicion').classList.add('d-none');
    }

    function eliminarNota(id) {
        if (confirm("¿Estás seguro de eliminar esta publicación?")) {
            db.collection("notas").doc(id).delete().catch(err => alert("Error al eliminar."));
            if (idEdicionActual === id) cancelarEdicion(); 
        }
    }

    // --- ESCUCHAR NOTAS ---
    if (db) {
        db.collection("notas").orderBy("timestamp", "desc").onSnapshot((querySnapshot) => {
            const feed = document.getElementById('feed-notas');
            feed.innerHTML = ""; 
            notasData = {}; 
            
            const miNombre = document.getElementById('nombre-usuario').value.trim().toLowerCase();

            querySnapshot.forEach((doc) => {
                const nota = doc.data();
                notasData[doc.id] = nota; 
                
                let htmlImagen = nota.imagen ? `<img src="${nota.imagen}" class="note-img mt-2">` : '';
                let textoEditado = nota.editado ? `<span class="text-muted ms-2" style="font-size:0.6rem;">(Editado)</span>` : '';
                
                let iconoUser = (nota.autor.toLowerCase() === miNombre) ? "fa-user-circle text-brand" : "fa-user-astronaut text-secondary";

                feed.innerHTML += `
                    <div class="card card-custom note-card mb-3 border-0 shadow-sm" style="animation: fadeIn 0.5s;">
                        <div class="action-buttons">
                            <button class="btn-icon text-primary" onclick="iniciarEdicionNota('${doc.id}')" title="Editar"><i class="fas fa-pencil-alt"></i></button>
                            <button class="btn-icon text-danger" onclick="eliminarNota('${doc.id}')" title="Eliminar"><i class="fas fa-trash-alt"></i></button>
                        </div>
                        <div class="card-body">
                            <div class="d-flex justify-content-between text-muted small mb-2" style="padding-right: 40px;">
                                <span class="fw-bold text-dark"><i class="fas ${iconoUser} me-1"></i> ${nota.autor}</span>
                                <span>${nota.fecha_texto || ''} ${textoEditado}</span>
                            </div>
                            <div class="card-text mb-0">${nota.texto}</div>
                            ${htmlImagen}
                        </div>
                    </div>
                `;
            });
        });
    }

    // --- CHAT DEL EQUIPO ---
    function enviarMensaje() {
        if (!db) return;
        const msj = document.getElementById('chat-input').value.trim();
        const autor = document.getElementById('nombre-usuario').value.trim(); 
        
        if (!msj) return;

        db.collection("chat").add({
            autor: autor,
            mensaje: msj,
            timestamp: firebase.firestore.FieldValue.serverTimestamp()
        }).catch(err => alert("Error enviando mensaje."));

        document.getElementById('chat-input').value = "";
    }

    function manejarEnterChat(e) {
        if (e.key === "Enter") enviarMensaje();
    }

    if (db) {
        db.collection("chat").orderBy("timestamp", "asc").onSnapshot((querySnapshot) => {
            const chatBox = document.getElementById('chat-messages');
            chatBox.innerHTML = "";
            const miNombre = document.getElementById('nombre-usuario').value.trim().toLowerCase();

            querySnapshot.forEach((doc) => {
                const chat = doc.data();
                const isMe = (chat.autor.toLowerCase() === miNombre);
                const bubbleClass = isMe ? "chat-me" : "chat-other";
                
                chatBox.innerHTML += `
                    <div class="chat-bubble ${bubbleClass}">
                        ${!isMe ? `<div class="chat-author text-brand">${chat.autor}</div>` : ''}
                        ${chat.mensaje}
                    </div>
                `;
            });
            chatBox.scrollTop = chatBox.scrollHeight;
        });
    }

    // --- BIBLIOGRAFÍA ---
    function agregarBibliografia() {
        if (!db) return;
        const titulo = prompt("Ingresa el título de la fuente:");
        if (!titulo) return;
        let url = prompt("Ingresa el enlace web (URL):") || "#";
        if (url !== "#" && !url.startsWith('http')) url = 'https://' + url;

        db.collection("bibliografia").add({
            titulo: titulo,
            url: url,
            timestamp: firebase.firestore.FieldValue.serverTimestamp()
        }).catch(err => alert("Error agregando bibliografía."));
    }

    function editarBiblio(id) {
        const data = biblioData[id];
        const nuevoTitulo = prompt("Editar título de la fuente:", data.titulo);
        if (nuevoTitulo === null) return; 
        
        let nuevaUrl = prompt("Editar enlace web (URL):", data.url);
        if (nuevaUrl === null) return;
        if (nuevaUrl !== "#" && !nuevaUrl.startsWith('http')) nuevaUrl = 'https://' + nuevaUrl;

        db.collection("bibliografia").doc(id).update({ titulo: nuevoTitulo, url: nuevaUrl });
    }

    function eliminarBiblio(id) {
        if (confirm("¿Eliminar esta referencia de la bibliografía?")) {
            db.collection("bibliografia").doc(id).delete();
        }
    }

    if (db) {
        db.collection("bibliografia").orderBy("timestamp", "desc").onSnapshot((querySnapshot) => {
            const lista = document.getElementById('lista-biblio');
            lista.innerHTML = "";
            biblioData = {};

            querySnapshot.forEach((doc) => {
                const bib = doc.data();
                biblioData[doc.id] = bib; 
                
                lista.innerHTML += `
                    <li class="list-group-item border-0 border-bottom py-3 position-relative group-hover">
                        <div class="d-flex justify-content-between align-items-start">
                            <div>
                                <div class="fw-semibold text-dark">${bib.titulo}</div>
                                <a href="${bib.url}" target="_blank" class="text-decoration-none small text-primary">
                                    <i class="fas fa-external-link-alt me-1"></i> Ver recurso
                                </a>
                            </div>
                            <div class="d-flex gap-2">
                                <button class="btn btn-sm text-secondary p-0" onclick="editarBiblio('${doc.id}')" title="Editar"><i class="fas fa-edit"></i></button>
                                <button class="btn btn-sm text-danger p-0" onclick="eliminarBiblio('${doc.id}')" title="Eliminar"><i class="fas fa-trash"></i></button>
                            </div>
                        </div>
                    </li>
                `;
            });
        });
    }
</script>

<style> @keyframes fadeIn { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } } </style>
</body>
</html>
