<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Investigación - UNP</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- FIREBASE (El motor para que sea en tiempo real) -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

    <style>
        body { background-color: #f8f9fa; color: #212529; font-family: system-ui, sans-serif; padding-bottom: 50px; }
        .text-brand { color: #712cf9; }
        .bg-brand { background-color: #712cf9; color: white; }
        .btn-brand { background-color: #712cf9; color: white; border: none; }
        .btn-brand:hover { background-color: #5a23c8; color: white; }
        .card-custom { border: 1px solid rgba(0,0,0,.08); border-radius: 0.75rem; box-shadow: 0 0.125rem 0.25rem rgba(0,0,0,.04); background: #fff; }
        [contenteditable="true"] { padding: 5px; border-radius: 4px; transition: 0.2s; }
        [contenteditable="true"]:hover { background-color: #e9ecef; outline: none; }
        .note-card { border-left: 4px solid #712cf9 !important; }
        .form-control-custom { border: 1px solid #dee2e6; border-radius: 0.5rem; resize: none; }
        .form-control-custom:focus { border-color: #712cf9; box-shadow: 0 0 0 0.25rem rgba(113, 44, 249, 0.25); }
        .note-img { max-width: 100%; border-radius: 0.5rem; margin-top: 10px; border: 1px solid #e9ecef; }
        #preview-container { display: none; position: relative; margin-bottom: 10px; }
        #preview-img { max-height: 100px; border-radius: 5px; }
        .btn-remove-img { position: absolute; top: -10px; left: -10px; border-radius: 50%; padding: 2px 8px; }
    </style>
</head>
<body>

<div class="container py-4">
    <header class="pb-3 mb-4 border-bottom">
        <div class="text-muted small mb-2 fw-semibold">
            <i class="fas fa-university me-1 text-brand"></i> UNIVERSIDAD NACIONAL DE PIURA
        </div>
        <h1 class="fw-bold fs-2" contenteditable="true">Dinámica de la morosidad</h1>
        <h2 class="text-muted fs-5 fw-normal" contenteditable="true">Y sus determinantes macrofinancieros en la banca múltiple del Perú (2018-2026)</h2>
    </header>

    <div class="row g-4">
        <!-- COLUMNA IZQUIERDA: SÓLO EL FEED DE NOTAS -->
        <div class="col-lg-7">
            <h4 class="fw-bold mb-3"><i class="fas fa-satellite-dish me-2 text-brand"></i> Transmisiones del Equipo</h4>
            <!-- Feed donde aparecerán las notas de ambos -->
            <div id="feed-notas">
                <div class="text-center text-muted mt-5" id="cargando-notas">
                    <i class="fas fa-spinner fa-spin fa-2x mb-2"></i><br>Conectando a la base de datos...
                </div>
            </div>
        </div>

        <!-- COLUMNA DERECHA: PANELES DE CONTROL -->
        <div class="col-lg-5">
            
            <!-- PANEL 1: PUBLICAR NOTA -->
            <div class="card card-custom mb-4 border-0 shadow-sm" style="border-top: 4px solid #712cf9 !important;">
                <div class="card-header bg-white border-bottom fw-bold text-dark py-3">
                    <i class="fas fa-pen me-1 text-brand"></i> Nueva Publicación
                </div>
                <div class="card-body">
                    <!-- Nombre Editable Libremente -->
                    <div class="input-group input-group-sm mb-3 shadow-sm">
                        <span class="input-group-text bg-light border-end-0"><i class="fas fa-user text-brand"></i></span>
                        <input type="text" id="nombre-usuario" class="form-control border-start-0 fw-bold" placeholder="Escribe tu nombre..." value="Adriel">
                    </div>

                    <textarea id="texto-nota" class="form-control form-control-custom mb-2" rows="3" placeholder="Redacta un hallazgo o apunte..."></textarea>
                    
                    <div id="preview-container">
                        <img id="preview-img" src="" alt="Vista previa">
                        <button class="btn btn-danger btn-sm btn-remove-img" onclick="quitarImagen()"><i class="fas fa-times"></i></button>
                    </div>

                    <div class="d-flex justify-content-between align-items-center mt-3">
                        <input type="file" id="input-foto" accept="image/*" style="display: none;" onchange="cargarImagen(event)">
                        <button class="btn btn-sm btn-light border shadow-sm" onclick="document.getElementById('input-foto').click()">
                            <i class="fas fa-camera me-1 text-muted"></i> Foto
                        </button>
                        <button class="btn btn-brand px-4 shadow-sm fw-bold" onclick="publicarNota()">
                            Publicar <i class="fas fa-paper-plane ms-1"></i>
                        </button>
                    </div>
                </div>
            </div>

            <!-- PANEL 2: BIBLIOGRAFÍA SINCRONIZADA -->
            <div class="card card-custom mb-4 border-0 shadow-sm">
                <div class="card-header bg-white border-bottom d-flex justify-content-between align-items-center py-3">
                    <span class="fw-bold text-dark"><i class="fas fa-bookmark me-1 text-brand"></i> Bibliografía Compartida</span>
                    <button class="btn btn-sm btn-light border text-brand rounded-circle" onclick="agregarBibliografia()">
                        <i class="fas fa-plus"></i>
                    </button>
                </div>
                <div class="card-body p-0 px-3">
                    <ul class="list-group list-group-flush" id="lista-biblio">
                        <!-- Las bibliografías cargarán aquí automáticamente -->
                    </ul>
                </div>
            </div>

        </div>
    </div>
</div>

<script>
    // ==========================================
    // ¡AQUÍ PEGARÁS LA CONFIGURACIÓN DE FIREBASE!
    // ==========================================
    const firebaseConfig = {
        // Pega las claves de tu proyecto aquí dentro en el paso 2
    };

    // Inicializar Firebase (Solo funcionará cuando pegues tus claves arriba)
    let db;
    try {
        firebase.initializeApp(firebaseConfig);
        db = firebase.firestore();
    } catch (e) {
        document.getElementById('cargando-notas').innerHTML = "⚠️ Falta configurar las claves de Firebase en el código.";
    }

    let imagenActualBase64 = null;

    // --- FUNCIONES DE IMÁGENES ---
    function cargarImagen(event) {
        const archivo = event.target.files[0];
        if (archivo) {
            const lector = new FileReader();
            lector.onload = function(e) {
                imagenActualBase64 = e.target.result;
                document.getElementById('preview-img').src = imagenActualBase64;
                document.getElementById('preview-container').style.display = 'inline-block';
            }
            lector.readAsDataURL(archivo);
        }
    }

    function quitarImagen() {
        imagenActualBase64 = null;
        document.getElementById('preview-img').src = "";
        document.getElementById('preview-container').style.display = 'none';
        document.getElementById('input-foto').value = "";
    }

    // --- PUBLICAR NOTA EN LA NUBE ---
    function publicarNota() {
        if (!db) return alert("Configura Firebase primero.");
        const texto = document.getElementById('texto-nota').value.trim();
        const autor = document.getElementById('nombre-usuario').value.trim() || "Anónimo";
        
        if (texto === "" && !imagenActualBase64) return alert("Escribe un texto o sube una imagen.");

        // Crear la nota en la nube
        db.collection("notas").add({
            autor: autor,
            texto: texto.replace(/\n/g, '<br>'),
            imagen: imagenActualBase64,
            fecha_texto: new Date().toLocaleDateString('es-ES', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' }),
            timestamp: firebase.firestore.FieldValue.serverTimestamp() // Para ordenar cronológicamente
        }).then(() => {
            document.getElementById('texto-nota').value = "";
            quitarImagen();
        });
    }

    // --- ESCUCHAR NOTAS EN TIEMPO REAL ---
    if (db) {
        db.collection("notas").orderBy("timestamp", "desc").onSnapshot((querySnapshot) => {
            const feed = document.getElementById('feed-notas');
            feed.innerHTML = ""; // Limpiamos
            
            querySnapshot.forEach((doc) => {
                const nota = doc.data();
                let htmlImagen = nota.imagen ? `<img src="${nota.imagen}" class="note-img mt-2">` : '';
                
                feed.innerHTML += `
                    <div class="card card-custom note-card mb-3 border-0 shadow-sm" style="animation: fadeIn 0.5s;">
                        <div class="card-body">
                            <div class="d-flex justify-content-between text-muted small mb-2">
                                <span class="fw-bold text-dark"><i class="fas fa-user-circle me-1 text-brand"></i> ${nota.autor}</span>
                                <span>${nota.fecha_texto || ''}</span>
                            </div>
                            <p class="card-text mb-0">${nota.texto}</p>
                            ${htmlImagen}
                        </div>
                    </div>
                `;
            });
        });
    }

    // --- AGREGAR BIBLIOGRAFÍA A LA NUBE ---
    function agregarBibliografia() {
        if (!db) return alert("Configura Firebase primero.");
        const titulo = prompt("Ingresa el título de la fuente:");
        if (!titulo) return;
        let url = prompt("Ingresa el enlace web (URL):") || "#";
        if (url !== "#" && !url.startsWith('http')) url = 'https://' + url;

        db.collection("bibliografia").add({
            titulo: titulo,
            url: url,
            timestamp: firebase.firestore.FieldValue.serverTimestamp()
        });
    }

    // --- ESCUCHAR BIBLIOGRAFÍA EN TIEMPO REAL ---
    if (db) {
        db.collection("bibliografia").orderBy("timestamp", "desc").onSnapshot((querySnapshot) => {
            const lista = document.getElementById('lista-biblio');
            lista.innerHTML = "";
            querySnapshot.forEach((doc) => {
                const bib = doc.data();
                lista.innerHTML += `
                    <li class="list-group-item border-0 border-bottom py-3">
                        <div class="fw-semibold text-dark">${bib.titulo}</div>
                        <a href="${bib.url}" target="_blank" class="text-decoration-none small text-primary">
                            <i class="fas fa-external-link-alt me-1"></i> Ver recurso
                        </a>
                    </li>
                `;
            });
        });
    }
</script>

<style> @keyframes fadeIn { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } } </style>
</body>
</html>
